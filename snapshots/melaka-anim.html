    tiles[i].style.borderWidth=close?'3px':'2px';
  }
  // score
  const A=S21,B=sc0[0],C=sc0[1];
  const m1=mix1=>mix1;
  const pick=k=>{const a=A[k]*(1-k1)+B[k]*k1;return a*(1-k2)+C[k]*k2};
  const vals=[pick('pact'),pick('ph'),pick('oth')];
  const cc=['var(--bn)','var(--ph)','var(--bsm)'];
  for(let i=0;i<3;i++){const e=$('sv'+i);e.style.color=cc[i];e.textContent=(t<7.0?vals[i].toFixed(0):vals[i].toFixed(1))}
  // note
  let note='';
  if(t<7.0)note=TX.n2;else if(t<12.6)note=TX.p15+' '+pf(P15[0])+' · '+TX.p19+' '+pf(P19[0]);else note=TX.p15+' '+pf(P15[1])+' · '+TX.p19+' '+pf(P19[1]);
  $('note').innerHTML='<span>'+note+'</span>';
  // majority scene
  const majOp=fade(t,19.3,19.9,25.0,25.6);
  $('maj').style.opacity=majOp;
  $('tk').style.opacity=0;
  if(majOp>0){
    if(t>=19.3&&t<25.6){$('title').style.opacity=majOp;setTitle(TX.t5,TX.s5)}
    for(let i=0;i<2;i++){const s=i?sc0[1]:sc0[0],g=ease(seg(t,19.8+i*0.5,21.4+i*0.5));
      const bar=$('mb'+i).children;
      bar[0].style.width=(s.pact/28*100*g)+'%';bar[1].style.width=(s.oth/28*100*g)+'%';bar[2].style.width=(s.ph/28*100*g)+'%';bar[0].textContent=g>0.6?s.pact.toFixed(1):'';bar[2].textContent=g>0.6?s.ph.toFixed(1):'';bar[2].style.justifyContent='flex-end';$('tk').style.opacity=majOp*ease(seg(t,22.6,23.3));
      $('a'+i).textContent=(g>0.98?pf(P15[i]):Math.round(P15[i]*100*g)+'%');
      $('b'+i).textContent=(g>0.98?pf(P19[i]):Math.round(P19[i]*100*g)+'%')}
  }
  // watch scene
  const wOp=fade(t,25.4,26.0,29.6,30.2);
  $('watch').style.opacity=wOp;
  if(t>=25.4&&t<30.2){$('title').style.opacity=wOp;setTitle(TX.t6,TX.s6)}
  const wc=$('watch').children;for(let i=0;i<6;i++){const e=ease(seg(t,26.0+i*0.3,26.5+i*0.3));wc[i].style.opacity=e;wc[i].style.transform='translateY('+(24*(1-e))+'px)'}
  // end
  $('end').style.opacity=fade(t,30.0,30.7,99,100);
  $('end').style.transform='scale('+(0.97+0.03*ease(seg(t,30.0,31)))+')';
  $('foot').style.opacity=(t>=2.9&&t<30.0)?1:0;
  $('top').style.opacity=1;
}
render(0);
</script></body></html>
